<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1565C0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="가계부"/>
<title>가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#F0F7FF;--card:#FFFFFF;--card2:#F5F9FF;
  --text:#0A2540;--text2:#4A6080;--text3:#8FA8C0;
  --border:rgba(10,37,64,0.08);--border2:rgba(10,37,64,0.14);
  --shadow:0 1px 4px rgba(10,37,64,0.08),0 4px 16px rgba(33,150,243,0.08);
  --shadow-sm:0 1px 3px rgba(10,37,64,0.07);
  --accent:#2196F3;--accent-bg:#E3F2FD;--accent-text:#0D47A1;
  --green:#00BFA5;--green-bg:#E0F7F4;--green-text:#006657;
  --red:#F44336;--red-bg:#FFEBEE;--red-text:#B71C1C;
  --amber:#FF9800;--amber-bg:#FFF8E1;--amber-text:#E65100;
  --purple:#7B1FA2;--purple-bg:#F3E5F5;--purple-text:#4A148C;
  --gray-bg:#ECEFF1;--gray-text:#546E7A;
  --hero-bg:linear-gradient(135deg,#1565C0 0%,#42A5F5 100%);
  --radius:16px;--radius-sm:10px;--radius-xs:8px;
  --font:"Pretendard",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#071625;--card:#0D2137;--card2:#102844;
    --text:#E8F4FF;--text2:#7BAFD4;--text3:#3D6080;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
    --shadow:0 1px 4px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.25);
    --shadow-sm:0 1px 3px rgba(0,0,0,0.25);
    --accent-bg:#0D2E52;--accent-text:#64B5F6;
    --green-bg:#003D35;--green-text:#4DB6AC;
    --red-bg:#3D0D0D;--red-text:#EF9A9A;
    --amber-bg:#2D1A00;--amber-text:#FFB74D;
    --purple-bg:#1A0D28;--purple-text:#CE93D8;
    --gray-bg:#102030;--gray-text:#78909C;
    --hero-bg:linear-gradient(135deg,#0A1929 0%,#0D3B6E 100%);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg)}
.content{flex:1;overflow-y:auto;padding-bottom:calc(72px + var(--safe-b));-webkit-overflow-scrolling:touch}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:0.5px solid var(--border);display:flex;align-items:center;padding:8px 6px;padding-bottom:calc(8px + var(--safe-b));box-shadow:0 -1px 0 var(--border)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;cursor:pointer;font-family:var(--font);font-size:10px;color:var(--text3);border-radius:12px}
.navbtn.on{color:var(--accent)}
.navbtn svg{width:22px;height:22px;stroke-width:1.7}
.navbtn span{font-weight:600;letter-spacing:-.2px}
.hero{background:var(--hero-bg);padding:20px 20px 24px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);top:-60px;right:-40px;pointer-events:none}
.hero::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-50px;left:20px;pointer-events:none}
.hero-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative;z-index:1}
.hero-month{font-size:15px;font-weight:600;color:rgba(255,255,255,.9)}
.hero-navbtn{background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:5px 10px;font-size:12px;color:rgba(255,255,255,.85);cursor:pointer;font-family:var(--font);font-weight:500}
.hero-navbtn:active{background:rgba(255,255,255,.25)}
.hero-bal-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:500;margin-bottom:5px;position:relative;z-index:1;letter-spacing:.3px;text-transform:uppercase}
.hero-bal{font-size:34px;font-weight:700;color:#fff;letter-spacing:-1.5px;position:relative;z-index:1;line-height:1.1}
.hero-bal span{font-size:20px;font-weight:600;margin-right:2px;opacity:.75}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.12);border-radius:11px;padding:10px 11px;backdrop-filter:blur(4px)}
.hero-stat-label{font-size:10px;color:rgba(255,255,255,.5);font-weight:500;margin-bottom:3px}
.hero-stat-val{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.4px}
.insight{background:rgba(255,255,255,.13);border-radius:11px;padding:10px 13px;margin-top:10px;position:relative;z-index:1;font-size:12px;color:rgba(255,255,255,.9);font-weight:500;line-height:1.5;backdrop-filter:blur(4px)}
.insight b{color:#fff;font-weight:700}
.sec{padding:0 16px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.sec-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.2px;text-transform:uppercase}
.sec-action{font-size:12px;color:var(--accent);font-weight:700;background:none;border:none;cursor:pointer;font-family:var(--font)}
.card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:14px;letter-spacing:.4px;text-transform:uppercase}
.form-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.field-group{margin-bottom:11px}
.field-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 13px;font-size:14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--card2);color:var(--text);outline:none;font-family:var(--font);-webkit-appearance:none;appearance:none;font-weight:500;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
textarea{resize:none;height:72px;line-height:1.5}
.row{display:grid;gap:8px;margin-bottom:11px}
.r3{grid-template-columns:2fr 1fr 1fr}
.r2{grid-template-columns:1fr 1fr}
.r2b{grid-template-columns:1fr 1fr 1fr}
.addbtn{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-family:var(--font);letter-spacing:-.2px}
.addbtn:active{opacity:.85}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--card2);margin-bottom:11px}
.toggle-label{font-size:13px;color:var(--text);font-weight:600}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:12px;background:var(--text3);cursor:pointer;transition:background .2s}
.slider:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.tx-list{display:flex;flex-direction:column;gap:2px}
.tx-item{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;background:var(--card);transition:background .1s}
.tx-item:first-child{border-radius:var(--radius) var(--radius) 0 0}
.tx-item:last-child{border-radius:0 0 var(--radius) var(--radius)}
.tx-item:only-child{border-radius:var(--radius)}
.tx-item:not(:last-child){border-bottom:0.5px solid var(--border)}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:1px}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.tx-memo{font-size:11px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.b-fixed{background:var(--accent-bg);color:var(--accent-text)}
.b-personal{background:var(--green-bg);color:var(--green-text)}
.b-shared{background:var(--purple-bg);color:var(--purple-text)}
.b-nobal{background:var(--gray-bg);color:var(--gray-text)}
.b-inst{background:var(--amber-bg);color:var(--amber-text)}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.tx-amt{font-size:15px;font-weight:700;letter-spacing:-.4px}
.tx-amt-sub{font-size:10px;color:var(--text3);font-weight:500}
.tx-btns{display:flex;gap:4px;margin-top:2px}
.tx-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:5px;font-family:var(--font)}
.tx-btn:active{background:var(--card2)}
.inst-bar-wrap{height:2px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.inst-bar{height:100%;border-radius:2px;background:var(--amber)}
.tabbar{display:flex;gap:6px;padding:0 16px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;font-size:12px;border:none;border-radius:20px;background:var(--card);color:var(--text2);cursor:pointer;font-family:var(--font);font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm);flex-shrink:0}
.tab.on{background:var(--accent);color:#fff}
.search-wrap{padding:0 16px 10px;display:flex;gap:8px;align-items:center}
.search-wrap input{margin:0;flex:1}
.sort-btn{padding:10px 13px;font-size:12px;font-weight:600;border:1.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--card);color:var(--text2);cursor:pointer;font-family:var(--font);white-space:nowrap;flex-shrink:0}
.sort-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.prog-track{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin:5px 0}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}
.week-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.week-card.current{border:1.5px solid var(--accent)}
.week-card.done{border:1.5px solid var(--green)}
.week-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.week-name{font-size:13px;font-weight:700;color:var(--text);flex:1}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.pill-blue{background:var(--accent-bg);color:var(--accent-text)}
.pill-amber{background:var(--amber-bg);color:var(--amber-text)}
.pill-green{background:var(--green-bg);color:var(--green-text)}
.week-sub{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.week-sub-item{font-size:11px;color:var(--text2);font-weight:500}
.budget-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:16px;flex-wrap:wrap}
.budget-row input{flex:1;min-width:80px;margin:0}
.savebtn{padding:10px 16px;font-size:12px;font-weight:700;border:none;border-radius:var(--radius-xs);background:var(--accent);color:#fff;cursor:pointer;font-family:var(--font);flex-shrink:0}
.rec-list-wrap{box-shadow:var(--shadow-sm);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.rec-item{display:flex;align-items:center;gap:11px;padding:13px 15px;background:var(--card);border-bottom:0.5px solid var(--border);transition:background .1s;user-select:none}
.rec-item:last-child{border-bottom:none}
.rec-item.dragging{opacity:.5;background:var(--card2)}
.rec-item.drag-over{border-top:2px solid var(--accent)}
.drag-handle{color:var(--text3);cursor:grab;font-size:16px;padding:0 2px;flex-shrink:0;touch-action:none}
.drag-handle:active{cursor:grabbing}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:14px;font-weight:600;color:var(--text)}
.rec-sub{font-size:11px;color:var(--text2);margin-top:2px;font-weight:500}
.rec-pause-btn{background:none;border:1.5px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--text2);flex-shrink:0}
.rec-pause-btn.paused{border-color:var(--amber);color:var(--amber-text);background:var(--amber-bg)}
.applied-pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;flex-shrink:0}
.rec-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px;flex-shrink:0}
.trend-wrap{position:relative;height:210px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-weight:600}
.legend-dot{width:8px;height:8px;border-radius:3px}
.legend-line{width:16px;height:2px;border-radius:2px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:5px;letter-spacing:.2px;text-transform:uppercase}
.budget-summary{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.budget-summary-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px;letter-spacing:.4px;text-transform:uppercase}
.budget-summary-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cat-item{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:10px;transition:box-shadow .15s;user-select:none}
.cat-item.editing{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.cat-item.dragging{opacity:.5}
.cat-item.drag-over{border-top:2px solid var(--accent)}
.cat-top{display:flex;align-items:center;gap:11px}
.cat-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:14px;font-weight:700;color:var(--text)}
.cat-sub{font-size:11px;color:var(--text2);margin-top:3px;font-weight:500}
.cat-btns{display:flex;gap:5px;align-items:center}
.cat-edit-btn{background:var(--card2);border:none;border-radius:var(--radius-xs);padding:7px 12px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;font-family:var(--font)}
.edit-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.edit-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-blue{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-xs);padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);width:100%}
.btn-red{background:var(--red-bg);color:var(--red-text);border:none;border-radius:var(--radius-xs);padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);width:100%}
.btn-cancel{width:100%;background:var(--card2);border:none;border-radius:var(--radius-xs);padding:10px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:var(--font);margin-top:6px}
.colorpicker{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:8px 0 12px}
.colorchip{width:100%;aspect-ratio:1;border-radius:7px;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.colorchip.on{border-color:var(--text);transform:scale(1.1)}
.group-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:16px 16px 8px;display:block}
.budget-progress-row{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.donut-wrap{position:relative;height:190px;margin-bottom:12px}
.cat-legend-list{display:flex;flex-direction:column;gap:6px}
.cat-legend-row{display:flex;align-items:center;gap:8px;font-size:12px}
.cat-legend-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.backup-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn-export{background:var(--green);color:#fff;border:none;border-radius:var(--radius-xs);padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}
.btn-import{background:var(--card2);color:var(--text);border:1.5px solid var(--border2);border-radius:var(--radius-xs);padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}
.tip{font-size:12px;color:var(--amber-text);padding:12px 14px;background:var(--amber-bg);border-radius:var(--radius-sm);margin-bottom:12px;line-height:1.6;font-weight:500}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:32px 0;font-weight:500}
.edit-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;padding-bottom:var(--safe-b)}
.edit-modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.edit-modal-box{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 18px 24px;max-height:90dvh;overflow-y:auto}
.edit-modal-title{font-size:16px;font-weight:700;margin-bottom:18px;color:var(--text)}
.avg-badge{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);font-weight:700;flex-shrink:0}
</style>

</div>
<script>
var PC=[
  "#F44336","#E91E63","#FF4081","#FF5722","#FF9800",

  nextId:1,nextRId:1,nextCK:100,
  curY:new Date().getFullYear(),curM:new Date().getMonth()+1,
  tab:"history",histTab:"all"
};}
function migrate(s){
  if(s.cats&&!s.expCats){s.expCats=s.cats;delete s.cats;}
  if(!s.expCats)s.expCats=defaultExpCats();
  if(!s.incCats)s.incCats=defaultIncCats();
  if(!s.nextCK)s.nextCK=100;
  s.txns.forEach(function(t){if(!t.memo)t.memo="";});
  s.recurring.forEach(function(r){if(r.paused===undefined)r.paused=false;});
  return s;
}
function loadState(){
  try{var s=localStorage.getItem("kakeibo-v2");if(s)return migrate(JSON.parse(s));}catch(e){}
  return defaultState();
}
function saveState(){try{localStorage.setItem("kakeibo-v2",JSON.stringify(state));}catch(e){}}

function pad(n){return String(n).padStart(2,"0");}
function mk(y,m){return y+"-"+pad(m);}
function fmt(v){return v.toLocaleString("ko-KR")+"원";}
function fS(v){var a=Math.abs(v);if(a>=1000000)return(v/1000000).toFixed(1)+"백만";if(a>=10000)return Math.round(v/10000)+"만";return v.toLocaleString("ko-KR");}
function fSF(v){return v.toLocaleString("ko-KR");}
function gMT(y,m){return state.txns.filter(function(t){return t.date.indexOf(mk(y,m))===0;});}
function gEC(k){return state.expCats.find(function(c){return c.key===k;})||{key:"?",label:"기타",emoji:"📦",color:"#607D8B"};}
function gIC(k){return state.incCats.find(function(c){return c.key===k;})||{key:"?",label:"기타",emoji:"📦",color:"#607D8B"};}
function gCat(t){return t.type==="income"?gIC(t.cat):gEC(t.cat);}
function dStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

function getCalendarWeeks(y,m){
  var first=new Date(y,m-1,1),last=new Date(y,m,0);
  var dow=first.getDay(),offset=dow===0?-6:1-dow;
  var ws=new Date(first);ws.setDate(ws.getDate()+offset);
  var weeks=[],cur=new Date(ws);
  while(cur<=last){var s=new Date(cur),e=new Date(cur);e.setDate(e.getDate()+6);weeks.push({start:s,end:e});cur.setDate(cur.getDate()+7);}
  return weeks;
}
function wLabel(s,e,cy,cm){
  var sf=s.getFullYear(),sm=s.getMonth()+1,ef=e.getFullYear(),em=e.getMonth()+1;
  var sl=(sm!==cm||sf!==cy)?(sm+"/"+s.getDate()):(s.getDate()+"일");
  var el=(em!==cm||ef!==cy)?(em+"/"+e.getDate()):(e.getDate()+"일");
  return sl+" ~ "+el;
}
function isAdj(s,e,cy,cm){return(s.getMonth()+1!==cm||s.getFullYear()!==cy)||(e.getMonth()+1!==cm||e.getFullYear()!==cy);}
function getTxRange(s,e){var ss=dStr(s),ee=dStr(e);return state.txns.filter(function(t){return t.date>=ss&&t.date<=ee;});}

function applyRec(){
  var key=mk(state.curY,state.curM);
  if(!state.appliedRec[key])state.appliedRec[key]=[];
  var applied={};state.appliedRec[key].forEach(function(id){applied[id]=true;});
  var changed=false;
  state.recurring.forEach(function(r){
    if(r.paused)return;
    if(!applied[r.id]){
      var ld=new Date(state.curY,state.curM,0).getDate(),d=Math.min(r.day,ld);
      state.txns.push({id:state.nextId++,type:"expense",desc:r.desc,amount:r.amount,cat:r.cat,
        date:key+"-"+pad(d),expType:"fixed",affectsBalance:r.affectsBalance!==false,
        payType:"lump",instTotal:1,instCurrent:1,recurringId:r.id,memo:""});
      state.appliedRec[key].push(r.id);changed=true;
    }
  });
  // 할부 자동 다음 회차
  var prevKey=state.curM>1?mk(state.curY,state.curM-1):mk(state.curY-1,12);
  var prevTxns=state.txns.filter(function(t){return t.date.indexOf(prevKey)===0&&t.payType==="installment"&&t.instCurrent<t.instTotal;});
  prevTxns.forEach(function(pt){
    var alreadyNext=state.txns.some(function(t){return t.instParentId===pt.id||t.instParentId===pt.instParentId&&t.date.indexOf(key)===0;});
    if(!alreadyNext){
      state.txns.push({id:state.nextId++,type:"expense",desc:pt.desc,amount:pt.amount,cat:pt.cat,
        date:key+"-"+pad(Math.min(parseInt(pt.date.slice(8)),new Date(state.curY,state.curM,0).getDate())),
        expType:pt.expType,affectsBalance:pt.affectsBalance,
        payType:"installment",instTotal:pt.instTotal,instCurrent:pt.instCurrent+1,
        instParentId:pt.instParentId||pt.id,memo:pt.memo||""});
      changed=true;
    }
  });
  if(changed)saveState();
}

function txBadges(t){
  if(t.type==="income")return "";
  var et=t.expType||"personal";
  var b="<span class=\"badge "+(EXP_BADGE[et]||"b-personal")+"\">"+( EXP_LABELS[et]||"개인")+"</span>";
  if(t.affectsBalance===false)b+="<span class=\"badge b-nobal\">미차감</span>";
  if(t.payType==="installment")b+="<span class=\"badge b-inst\">"+t.instCurrent+"/"+t.instTotal+"회</span>";
  return b;
}

function getInsight(mt, prevMt){
  if(!prevMt||!prevMt.length)return null;
  var curExp=mt.filter(function(t){return t.type==="expense"&&t.affectsBalance!==false;}).reduce(function(s,t){return s+t.amount;},0);
  var prevExp=prevMt.filter(function(t){return t.type==="expense"&&t.affectsBalance!==false;}).reduce(function(s,t){return s+t.amount;},0);
  if(!prevExp)return null;
  var diff=curExp-prevExp;
  var pct=Math.abs(Math.round(diff/prevExp*100));
  // find top category change
  var cm={},pm={};
  mt.filter(function(t){return t.type==="expense";}).forEach(function(t){cm[t.cat]=(cm[t.cat]||0)+t.amount;});
  prevMt.filter(function(t){return t.type==="expense";}).forEach(function(t){pm[t.cat]=(pm[t.cat]||0)+t.amount;});
  var maxDiff=0,maxCat=null;
  Object.keys(cm).forEach(function(k){var d=(cm[k]||0)-(pm[k]||0);if(Math.abs(d)>Math.abs(maxDiff)){maxDiff=d;maxCat=k;}});
  var catName=maxCat?gEC(maxCat).label:"";
  var sign=diff>0?"더 썼어요 📈":"절약했어요 💪";
  var txt="지난달보다 <b>"+fS(Math.abs(diff))+"원</b> "+sign;
  if(maxCat&&Math.abs(maxDiff)>1000)txt+="<br>"+catName+" 지출이 "+(maxDiff>0?"<b style=\"color:#FFD0D0\">"+fS(maxDiff)+"원 증가</b>":"<b style=\"color:#C8FFE8\">"+fS(-maxDiff)+"원 감소</b>");
  return txt;
}

  mt.filter(function(t){return t.type==="income";}).forEach(function(t){incSp[t.cat]=(incSp[t.cat]||0)+t.amount;});

  // 월평균 계산
  var allMonths={};
  state.txns.forEach(function(t){var k=t.date.slice(0,7);if(!allMonths[k])allMonths[k]=1;});
  var numMonths=Math.max(Object.keys(allMonths).length,1);
  var expAvg={},incAvgMap={};
  state.txns.filter(function(t){return t.type==="expense";}).forEach(function(t){expAvg[t.cat]=(expAvg[t.cat]||0)+t.amount;});

  Object.keys(expAvg).forEach(function(k){expAvg[k]=Math.round(expAvg[k]/numMonths);});

  modal.id="edit-modal";
  modal.innerHTML=
    "<div class=\"edit-modal-bg\" onclick=\"closeEditTx()\"></div>"
    +"<div class=\"edit-modal-box\">"
      +"<div class=\"edit-modal-title\">내역 수정</div>"
      +"<div class=\"row r3\"><input id=\"et-desc\" type=\"text\" value=\""+t.desc+"\" placeholder=\"설명\"/><input id=\"et-amt\" type=\"number\" value=\""+t.amount+"\" min=\"1\"/><input id=\"et-date\" type=\"date\" value=\""+t.date+"\"/></div>"
      +"<div class=\"row r2\" style=\"margin-bottom:10px\"><select id=\"et-type\" onchange=\"onEditTypeChange()\"><option value=\"expense\""+( t.type==="expense"?" selected":"")+">지출</option><option value=\"income\""+( t.type==="income"?" selected":"")+">수입</option></select>"
        +"<select id=\"et-cat-inc\" style=\"display:"+(t.type==="income"?"":"none")+"\">"+incOpts+"</select></div>"
      +"<div id=\"et-exp-opts\" style=\"display:"+(t.type==="expense"?"":"none")+"\">"
        +"<div class=\"row r2\" style=\"margin-bottom:10px\"><select id=\"et-exptype\"><option value=\"personal\""+( t.expType==="personal"?" selected":"")+">개인 지출</option><option value=\"fixed\""+( t.expType==="fixed"?" selected":"")+">고정 지출</option><option value=\"shared\""+( t.expType==="shared"?" selected":"")+">공동 지출</option></select><select id=\"et-cat-exp\">"+expOpts+"</select></div>"
        +"<div class=\"toggle-row\"><span class=\"toggle-label\">내 잔액에서 차감</span><label class=\"switch\"><input type=\"checkbox\" id=\"et-aff\""+( t.affectsBalance!==false?" checked":"")+"/><span class=\"slider\"></span></label></div>"
      +"</div>"
      +"<textarea id=\"et-memo\" placeholder=\"메모 (선택)\">"+( t.memo||"")+"</textarea>"
      +"<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px\">"
        +"<button class=\"btn-blue\" onclick=\"saveEditTx()\">저장</button>"
        +"<button class=\"btn-cancel\" onclick=\"closeEditTx()\">취소</button>"
      +"</div>"
    +"</div>";
  document.body.appendChild(modal);
}
function openEditTx(id){editTxId=id;renderEditModal();}
function closeEditTx(){editTxId=null;var m=document.getElementById("edit-modal");if(m)m.remove();}
function onEditTypeChange(){
  var isExp=document.getElementById("et-type").value==="expense";
  var eo=document.getElementById("et-exp-opts"),ic=document.getElementById("et-cat-inc");
  if(eo)eo.style.display=isExp?"":"none";
  if(ic)ic.style.display=isExp?"none":"";
}
function saveEditTx(){
  var t=state.txns.find(function(tx){return tx.id===editTxId;});
  if(!t)return;
  var desc=document.getElementById("et-desc").value.trim();
  var amt=parseInt(document.getElementById("et-amt").value);
  var date=document.getElementById("et-date").value;
  var type=document.getElementById("et-type").value;
  if(!amt||!date){alert("금액과 날짜를 입력해주세요.");return;}
  t.desc=desc||(type==="income"?gIC(t.cat).label:gEC(t.cat).label);
  t.amount=amt;t.date=date;t.type=type;
  t.memo=document.getElementById("et-memo").value.trim();
  if(type==="income"){
    t.cat=document.getElementById("et-cat-inc").value;
  } else {
    t.cat=document.getElementById("et-cat-exp").value;
    t.expType=document.getElementById("et-exptype").value;
    t.affectsBalance=document.getElementById("et-aff").checked;
  }
  closeEditTx();saveState();renderContent();
}

// ── 드래그: 고정 지출 순서 ──
var recDragSrc=null;
function onRecDragStart(e,ri){recDragSrc=ri;e.currentTarget.classList.add("dragging");}
function onRecDragOver(e,ri){e.preventDefault();if(recDragSrc!==null&&recDragSrc!==ri){e.currentTarget.classList.add("drag-over");}}
function onRecDrop(e,ri){
  e.preventDefault();
  if(recDragSrc===null||recDragSrc===ri)return;
  var arr=state.recurring;
  var moved=arr.splice(recDragSrc,1)[0];
  arr.splice(ri,0,moved);
  recDragSrc=null;saveState();renderContent();
}
function onRecDragEnd(){recDragSrc=null;document.querySelectorAll(".rec-item").forEach(function(el){el.classList.remove("dragging","drag-over");});}

// ── 드래그: 카테고리 순서 ──
var catDragSrc=null;
function onCatDragStart(e,ctype,key){catDragSrc={ctype:ctype,key:key};e.currentTarget.classList.add("dragging");}
function onCatDragOver(e,ctype,key){e.preventDefault();if(catDragSrc&&!(catDragSrc.ctype===ctype&&catDragSrc.key===key)&&catDragSrc.ctype===ctype){e.currentTarget.classList.add("drag-over");}}
function onCatDrop(e,ctype,key){
  e.preventDefault();
  if(!catDragSrc||catDragSrc.ctype!==ctype||catDragSrc.key===key)return;
  var arr=ctype==="exp"?state.expCats:state.incCats;
  var fromIdx=arr.findIndex(function(c){return c.key===catDragSrc.key;});
  var toIdx=arr.findIndex(function(c){return c.key===key;});
  if(fromIdx<0||toIdx<0)return;
  var moved=arr.splice(fromIdx,1)[0];
  arr.splice(toIdx,0,moved);
  catDragSrc=null;saveState();renderContent();
}
function onCatDragEnd(){catDragSrc=null;document.querySelectorAll(".cat-item").forEach(function(el){el.classList.remove("dragging","drag-over");});}

// ── 핸들러 ──
function sTab(t){state.tab=t;editingCat=null;saveState();render();}
function pM(){state.curM--;if(state.curM<1){state.curM=12;state.curY--;}saveState();render();}
function nM(){state.curM++;if(state.curM>12){state.curM=1;state.curY++;}saveState();render();}
function sHT(t){state.histTab=t;saveState();renderContent();}
function onSearch(v){searchQ=v;renderContent();}
function setSort(m){sortMode=m;renderContent();}
function onTypeChange(){
  var isExp=document.getElementById("ft")&&document.getElementById("ft").value==="expense";
  var eo=document.getElementById("expense-options"),fi=document.getElementById("fc-inc");
  if(eo)eo.style.display=isExp?"":"none";
  if(fi)fi.style.display=isExp?"none":"";
}
function onPayChange(){
  var isInst=document.getElementById("fpay")&&document.getElementById("fpay").value==="installment";
  var iF=document.getElementById("inst-fields");if(iF)iF.style.display=isInst?"block":"none";
}
function addT(){
  var desc=document.getElementById("fd").value.trim();
  var amount=parseInt(document.getElementById("fa").value);
  var date=document.getElementById("fdt").value;
  var type=document.getElementById("ft").value;
  var memo=document.getElementById("fmemo").value.trim();
  if(!amount||amount<=0||!date){alert("금액과 날짜를 입력해주세요.");return;}
  var cat,expType="personal",affectsBalance=true,payType="lump",instTotal=1,instCurrent=1;
  if(type==="income"){cat=document.getElementById("fc-inc").value;if(!desc){desc=gIC(cat).label;}}
  else{
    cat=document.getElementById("fc-exp").value;if(!desc){desc=gEC(cat).label;}
    expType=document.getElementById("fet").value;affectsBalance=document.getElementById("faff").checked;
    payType=document.getElementById("fpay").value;
    if(payType==="installment"){
      instTotal=parseInt(document.getElementById("ftotal").value)||1;
      instCurrent=parseInt(document.getElementById("fcur").value)||1;
      if(instTotal<2){alert("할부는 2회 이상이어야 합니다.");return;}
      if(instCurrent<1||instCurrent>instTotal){alert("회차를 올바르게 입력해주세요.");return;}
    }
  }
  state.txns.push({id:state.nextId++,type:type,desc:desc,amount:amount,cat:cat,date:date,expType:expType,affectsBalance:affectsBalance,payType:payType,instTotal:instTotal,instCurrent:instCurrent,memo:memo});
  var parts=date.split("-");state.curY=parseInt(parts[0]);state.curM=parseInt(parts[1]);
  saveState();render();
}
function dT(id){if(!confirm("이 내역을 삭제할까요?"))return;state.txns=state.txns.filter(function(tx){return tx.id!==id;});saveState();render();}
function sWB(){var v=parseInt(document.getElementById("wbi").value);if(v>0){state.weeklyBudget=v;saveState();render();}}
function aRec(){
  var desc=document.getElementById("rd").value.trim();
  var amount=parseInt(document.getElementById("ra").value);
  var day=parseInt(document.getElementById("rday").value);
  var cat=document.getElementById("rc").value;
  var affR=document.getElementById("raff").checked;
  if(!amount||!day||day<1||day>31){alert("금액과 날짜를 올바르게 입력해주세요.");return;}
  if(!desc)desc=gEC(cat).label;
  var id=state.nextRId++;
  state.recurring.push({id:id,desc:desc,amount:amount,cat:cat,day:day,affectsBalance:affR,paused:false});
  var key=mk(state.curY,state.curM);
  if(!state.appliedRec[key])state.appliedRec[key]=[];
  var applied={};state.appliedRec[key].forEach(function(i){applied[i]=true;});
  if(!applied[id]){
    var ld=new Date(state.curY,state.curM,0).getDate(),d=Math.min(day,ld);
    state.txns.push({id:state.nextId++,type:"expense",desc:desc,amount:amount,cat:cat,date:key+"-"+pad(d),expType:"fixed",affectsBalance:affR,payType:"lump",instTotal:1,instCurrent:1,recurringId:id,memo:""});
    state.appliedRec[key].push(id);
  }
  saveState();render();
}
function dRec(id){if(!confirm("고정 지출을 삭제할까요?"))return;state.recurring=state.recurring.filter(function(r){return r.id!==id;});saveState();render();}
function toggleRecPause(id){
  var r=state.recurring.find(function(r){return r.id===id;});
  if(r)r.paused=!r.paused;
  saveState();renderContent();
}
function startEdit(ct,key){editingCat={ctype:ct,key:key};renderContent();}
function cancelEdit(){editingCat=null;renderContent();}
function setEditColor(col){
  document.querySelectorAll("#e-colorpicker .colorchip").forEach(function(chip){chip.classList.toggle("on",chip.style.backgroundColor===col||chip.style.background===col);});
  if(editingCat)editingCat.newColor=col;
}
function saveEdit(ct,key){
  var label=document.getElementById("e-label").value.trim();
  var emoji=document.getElementById("e-emoji").value.trim()||"📌";
  if(!label){alert("카테고리 이름을 입력해주세요.");return;}
  var arr=ct==="exp"?state.expCats:state.incCats;
  var cat=arr.find(function(c){return c.key===key;});
  if(!cat)return;
  cat.label=label;cat.emoji=emoji;
  if(editingCat&&editingCat.newColor)cat.color=editingCat.newColor;
  if(ct==="exp"){var be=document.getElementById("e-budget");if(be)state.catBudgets[key]=parseInt(be.value)||0;}
  editingCat=null;saveState();renderContent();
}
function deleteCat(ct,key){
  var arr=ct==="exp"?state.expCats:state.incCats;
  var cat=arr.find(function(c){return c.key===key;});
  if(state.txns.some(function(t){return t.cat===key;})){alert("'"+cat.label+"' 카테고리는 내역이 있어 삭제할 수 없어요.");return;}
  if(!confirm("'"+cat.label+"' 카테고리를 삭제할까요?"))return;
  if(ct==="exp"){state.expCats=state.expCats.filter(function(c){return c.key!==key;});delete state.catBudgets[key];}
  else state.incCats=state.incCats.filter(function(c){return c.key!==key;});
  editingCat=null;saveState();renderContent();
}
function selC(i){selCI=i;document.querySelectorAll(".colorpicker .colorchip").forEach(function(el,idx){el.classList.toggle("on",idx===i);});}
function aCat(){
  var label=document.getElementById("cl").value.trim();
  var emoji=document.getElementById("ce").value.trim()||"📌";
  var ct=document.getElementById("catype").value;
  var color=PC[selCI]||PC[0];
  if(!label){alert("카테고리 이름을 입력해주세요.");return;}
  var key=(ct==="inc"?"inc-":"")+"cat"+state.nextCK++;
  if(ct==="exp"){state.expCats.push({key:key,label:label,emoji:emoji,color:color});state.catBudgets[key]=0;}
  else state.incCats.push({key:key,label:label,emoji:emoji,color:color});
  selCI=0;saveState();renderContent();
}
function exportData(){
  var json=JSON.stringify(state,null,2);
  var blob=new Blob([json],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  var today=new Date(),ds=today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate());
  a.href=url;a.download="가계부_백업_"+ds+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importData(){
  var input=document.createElement("input");input.type="file";input.accept=".json";
  input.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var parsed=JSON.parse(ev.target.result);
        if(!parsed.txns){alert("올바른 백업 파일이 아닙니다.");return;}
        if(!confirm("현재 데이터를 백업 파일로 덮어쓸까요?"))return;
        state=migrate(parsed);saveState();editingCat=null;render();alert("복원 완료!");
      }catch(e){alert("파일을 읽을 수 없어요.");}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);input.click();document.body.removeChild(input);
}
render();
</script>
