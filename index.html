<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0F172A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="가계부"/>
<title>가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#F0F7FF;
  --card:#FFFFFF;
  --card2:#F5F9FF;
  --text:#0A2540;
  --text2:#4A6080;
  --text3:#8FA8C0;
  --border:rgba(10,37,64,0.08);
  --shadow:0 1px 4px rgba(10,37,64,0.08),0 4px 16px rgba(33,150,243,0.08);
  --shadow-sm:0 1px 3px rgba(10,37,64,0.07);
  --accent:#2196F3;
  --accent-bg:#E3F2FD;
  --accent-text:#0D47A1;
  --green:#00BFA5;
  --green-bg:#E0F7F4;
  --green-text:#006657;
  --red:#F44336;
  --red-bg:#FFEBEE;
  --red-text:#B71C1C;
  --amber:#FF9800;
  --amber-bg:#FFF8E1;
  --amber-text:#E65100;
  --purple:#7B1FA2;
  --purple-bg:#F3E5F5;
  --purple-text:#4A148C;
  --gray-bg:#ECEFF1;
  --gray-text:#546E7A;
  --hero-bg:linear-gradient(135deg,#1565C0 0%,#42A5F5 100%);
  --radius:16px;--radius-sm:10px;--radius-xs:8px;
  --font:'Pretendard',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#071625;--card:#0D2137;--card2:#102844;
    --text:#E8F4FF;--text2:#7BAFD4;--text3:#3D6080;
    --border:rgba(255,255,255,0.07);
    --shadow:0 1px 4px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.25);
    --shadow-sm:0 1px 3px rgba(0,0,0,0.25);
    --accent-bg:#0D2E52;--accent-text:#64B5F6;
    --green-bg:#003D35;--green-text:#4DB6AC;
    --red-bg:#3D0D0D;--red-text:#EF9A9A;
    --amber-bg:#2D1A00;--amber-text:#FFB74D;
    --purple-bg:#1A0D28;--purple-text:#CE93D8;
    --gray-bg:#102030;--gray-text:#78909C;
    --hero-bg:linear-gradient(135deg,#0A1929 0%,#0D3B6E 100%);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg)}
.content{flex:1;overflow-y:auto;padding-bottom:calc(72px + var(--safe-b));-webkit-overflow-scrolling:touch}

/* Bottom Nav */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:0.5px solid var(--border);display:flex;align-items:center;padding:8px 6px;padding-bottom:calc(8px + var(--safe-b));box-shadow:0 -1px 0 var(--border)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;cursor:pointer;font-family:var(--font);font-size:10px;color:var(--text3);border-radius:12px;transition:color .15s}
.navbtn.on{color:var(--accent)}
.navbtn svg{width:22px;height:22px;stroke-width:1.7}
.navbtn span{font-weight:600;letter-spacing:-.2px}

/* Hero */
.hero{background:var(--hero-bg);padding:20px 20px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(59,110,240,.15);top:-60px;right:-40px;pointer-events:none}
.hero::after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(6,194,112,.1);bottom:-50px;left:20px;pointer-events:none}
.hero-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;position:relative;z-index:1}
.hero-month{font-size:15px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:-.3px}
.hero-navbtn{background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:5px 10px;font-size:12px;color:rgba(255,255,255,.8);cursor:pointer;font-family:var(--font);font-weight:500;backdrop-filter:blur(4px)}
.hero-navbtn:active{background:rgba(255,255,255,.2)}
.hero-balance-label{font-size:12px;color:rgba(255,255,255,.55);font-weight:500;margin-bottom:6px;position:relative;z-index:1;letter-spacing:.3px;text-transform:uppercase}
.hero-balance{font-size:36px;font-weight:700;color:#FFFFFF;letter-spacing:-1.5px;position:relative;z-index:1;line-height:1.1}
.hero-balance span{font-size:22px;font-weight:600;margin-right:2px;opacity:.8}
.hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px;backdrop-filter:blur(4px)}
.hero-stat-label{font-size:10px;color:rgba(255,255,255,.5);font-weight:500;margin-bottom:4px;letter-spacing:.2px}
.hero-stat-val{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.5px}

/* Section */
.section{padding:0 16px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0 10px}
.section-title{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.section-action{font-size:12px;color:var(--accent);font-weight:600;background:none;border:none;cursor:pointer;font-family:var(--font)}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.card-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:14px;letter-spacing:.2px;text-transform:uppercase}

/* Form */
.form-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.field-group{margin-bottom:12px}
input,select{width:100%;padding:12px 13px;font-size:14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card2);color:var(--text);outline:none;font-family:var(--font);-webkit-appearance:none;appearance:none;font-weight:500;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent);background:var(--card)}
.row{display:grid;gap:8px;margin-bottom:12px}
.r3{grid-template-columns:2fr 1fr 1fr}
.r2{grid-template-columns:1fr 1fr}
.r2b{grid-template-columns:1fr 1fr 1fr}
.addbtn{width:100%;padding:14px;font-size:14px;font-weight:700;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-family:var(--font);letter-spacing:-.2px;transition:opacity .15s}
.addbtn:active{opacity:.85}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card2);margin-bottom:12px}
.toggle-label{font-size:13px;color:var(--text);font-weight:600}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:12px;background:var(--text3);cursor:pointer;transition:background .2s}
.slider:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(20px)}

/* Transaction items */
.tx-list{display:flex;flex-direction:column;gap:2px}
.tx-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);transition:background .1s}
.tx-item:first-child{border-radius:var(--radius) var(--radius) 0 0}
.tx-item:last-child{border-radius:0 0 var(--radius) var(--radius)}
.tx-item:only-child{border-radius:var(--radius)}
.tx-item:not(:last-child){border-bottom:0.5px solid var(--border)}
.tx-item:active{background:var(--card2)}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.tx-meta{font-size:11px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.b-fixed{background:var(--accent-bg);color:var(--accent-text)}
.b-personal{background:var(--green-bg);color:var(--green-text)}
.b-shared{background:var(--purple-bg);color:var(--purple-text)}
.b-nobal{background:var(--gray-bg);color:var(--gray-text)}
.b-inst{background:var(--amber-bg);color:var(--amber-text)}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.tx-amt{font-size:15px;font-weight:700;letter-spacing:-.4px}
.tx-amt-sub{font-size:10px;color:var(--text3);font-weight:500}
.tx-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;margin-top:2px}
.inst-bar-wrap{height:2px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.inst-bar{height:100%;border-radius:2px;background:var(--amber)}

/* Tabs */
.tabbar{display:flex;gap:6px;padding:0 16px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;font-size:12px;border:none;border-radius:20px;background:var(--card);color:var(--text2);cursor:pointer;font-family:var(--font);font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm);flex-shrink:0}
.tab.on{background:var(--accent);color:#fff}

/* Progress */
.prog-track{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}

/* Week card */
.week-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.week-card.current{border:1.5px solid var(--accent)}
.week-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.week-name{font-size:13px;font-weight:700;color:var(--text);flex:1}
.week-now{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);font-weight:700}
.week-adj{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--amber-bg);color:var(--amber-text);font-weight:700}
.week-pct{font-size:13px;font-weight:700;color:var(--text)}
.week-sub{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.week-sub-item{font-size:11px;color:var(--text2);font-weight:500}
.week-sub-item b{font-weight:700}

/* Budget row */
.budget-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:16px}
.budget-row input{flex:1;max-width:130px;margin:0}
.budget-row-label{font-size:13px;font-weight:600;color:var(--text);flex:0 0 auto}
.budget-row-unit{font-size:13px;color:var(--text2);flex:0 0 auto}
.savebtn{padding:10px 16px;font-size:12px;font-weight:700;border:none;border-radius:var(--radius-xs);background:var(--accent);color:#fff;cursor:pointer;font-family:var(--font);flex:0 0 auto}

/* Recurring */
.rec-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:0.5px solid var(--border)}
.rec-item:first-child{border-radius:var(--radius) var(--radius) 0 0}
.rec-item:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:none}
.rec-item:only-child{border-radius:var(--radius);border-bottom:none}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.rec-sub{font-size:11px;color:var(--text2);margin-top:2px;font-weight:500}
.applied-pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;flex-shrink:0}
.rec-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px;flex-shrink:0}

/* Trend */
.trend-wrap{position:relative;height:210px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-weight:600}
.legend-dot{width:8px;height:8px;border-radius:3px}
.legend-line{width:16px;height:2px;border-radius:2px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:10px;color:var(--text2);font-weight:600;margin-bottom:5px;letter-spacing:.2px;text-transform:uppercase}
.stat-val{font-size:13px;font-weight:700;letter-spacing:-.4px;color:var(--text)}

/* Category */
.cat-item{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:10px;transition:box-shadow .15s}
.cat-item.editing{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.cat-top{display:flex;align-items:center;gap:12px}
.cat-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.cat-sub{font-size:11px;color:var(--text2);margin-top:3px;font-weight:500}
.cat-edit-btn{background:var(--card2);border:none;border-radius:var(--radius-xs);padding:7px 12px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;font-family:var(--font)}
.edit-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.edit-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-blue{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-xs);padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}
.btn-red{background:var(--red-bg);color:var(--red-text);border:none;border-radius:var(--radius-xs);padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}
.btn-cancel{width:100%;background:var(--card2);border:none;border-radius:var(--radius-xs);padding:10px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:var(--font);margin-top:6px}
.colorpicker{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:8px 0 12px}
.colorchip{width:100%;aspect-ratio:1;border-radius:7px;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.colorchip.on{border-color:var(--text);transform:scale(1.1)}
.group-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:18px 16px 8px;display:block}
.budget-progress-row{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}

/* Chart donut */
.donut-wrap{position:relative;height:190px;margin-bottom:12px}
.cat-legend-list{display:flex;flex-direction:column;gap:6px}
.cat-legend-row{display:flex;align-items:center;gap:8px;font-size:12px}
.cat-legend-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}

/* Backup */
.backup-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn-export{background:var(--green);color:#fff;border:none;border-radius:var(--radius-xs);padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}
.btn-import{background:var(--card2);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}

/* Tip */
.tip{font-size:12px;color:var(--text2);padding:12px 14px;background:var(--amber-bg);border-radius:var(--radius-sm);margin-bottom:12px;line-height:1.6;font-weight:500}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:32px 0;font-weight:500}
.pb16{padding-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <div class="content" id="content"></div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<script>
var PC=[
  '#F44336','#E91E63','#FF4081','#FF5722','#FF9800',
  '#FFC107','#FFEB3B','#CDDC39','#8BC34A','#4CAF50',
  '#00C853','#00BFA5','#00BCD4','#03A9F4','#2196F3',
  '#1565C0','#3F51B5','#673AB7','#9C27B0','#7B1FA2',
  '#795548','#607D8B','#78909C','#F48FB1','#FFCC80',
  '#A5D6A7','#80DEEA','#90CAF9','#CE93D8','#FFAB91'
];
var EXP_LABELS={fixed:'고정',personal:'개인',shared:'공동'};
var EXP_BADGE={fixed:'b-fixed',personal:'b-personal',shared:'b-shared'};
var state=loadState(),charts={};
var editingCat=null;
var selCI=0;

function defaultExpCats(){return[
  {key:'food',  label:'식비',     emoji:'🍽',color:'#E24B4A'},
  {key:'trans', label:'교통',     emoji:'🚌',color:'#3B6EF0'},
  {key:'shop',  label:'쇼핑',     emoji:'🛍',color:'#D4537E'},
  {key:'house', label:'주거',     emoji:'🏠',color:'#BA7517'},
  {key:'health',label:'의료',     emoji:'💊',color:'#06C270'},
  {key:'fun',   label:'문화/여가',emoji:'🎬',color:'#7C3AED'},
  {key:'other', label:'기타',     emoji:'📦',color:'#64748B'}
];}
function defaultIncCats(){return[
  {key:'inc-salary',label:'월급', emoji:'💼',color:'#06C270'},
  {key:'inc-pocket',label:'용돈', emoji:'🎁',color:'#3B6EF0'},
  {key:'inc-side',  label:'부업', emoji:'💡',color:'#F59E0B'},
  {key:'inc-other', label:'기타', emoji:'📦',color:'#64748B'}
];}
function defaultState(){return{
  expCats:defaultExpCats(),incCats:defaultIncCats(),
  txns:[],recurring:[],
  catBudgets:{food:400000,trans:150000,shop:200000,house:200000,health:100000,fun:100000,other:50000},
  weeklyBudget:200000,appliedRec:{},
  nextId:1,nextRId:1,nextCK:100,
  curY:new Date().getFullYear(),curM:new Date().getMonth()+1,
  tab:'history',histTab:'all'
};}
function migrate(s){
  if(s.cats&&!s.expCats){s.expCats=s.cats;delete s.cats;}
  if(!s.expCats)s.expCats=defaultExpCats();
  if(!s.incCats)s.incCats=defaultIncCats();
  if(!s.nextCK)s.nextCK=100;
  return s;
}
function loadState(){
  try{var s=localStorage.getItem('kakeibo-v2');if(s)return migrate(JSON.parse(s));}catch(e){}
  return defaultState();
}
function saveState(){try{localStorage.setItem('kakeibo-v2',JSON.stringify(state));}catch(e){}}

function pad(n){return String(n).padStart(2,'0');}
function mk(y,m){return y+'-'+pad(m);}
function fmt(v){return v.toLocaleString('ko-KR')+'원';}
function fS(v){var a=Math.abs(v);if(a>=1000000)return(v/1000000).toFixed(1)+'백만';if(a>=10000)return Math.round(v/10000)+'만';return v.toLocaleString('ko-KR');}
function fSFull(v){return v.toLocaleString('ko-KR');}
function gMT(y,m){return state.txns.filter(function(t){return t.date.indexOf(mk(y,m))===0;});}
function gEC(k){return state.expCats.find(function(c){return c.key===k;})||{key:'?',label:'기타',emoji:'📦',color:'#64748B'};}
function gIC(k){return state.incCats.find(function(c){return c.key===k;})||{key:'?',label:'기타',emoji:'📦',color:'#64748B'};}
function gCat(t){return t.type==='income'?gIC(t.cat):gEC(t.cat);}
function dStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function getCalendarWeeks(y,m){
  var first=new Date(y,m-1,1),last=new Date(y,m,0);
  var dow=first.getDay(),offset=dow===0?-6:1-dow;
  var ws=new Date(first);ws.setDate(ws.getDate()+offset);
  var weeks=[],cur=new Date(ws);
  while(cur<=last){var s=new Date(cur),e=new Date(cur);e.setDate(e.getDate()+6);weeks.push({start:s,end:e});cur.setDate(cur.getDate()+7);}
  return weeks;
}
function wLabel(s,e,cy,cm){
  var sf=s.getFullYear(),sm=s.getMonth()+1,ef=e.getFullYear(),em=e.getMonth()+1;
  var sl=(sm!==cm||sf!==cy)?(sm+'/'+s.getDate()):(s.getDate()+'일');
  var el=(em!==cm||ef!==cy)?(em+'/'+e.getDate()):(e.getDate()+'일');
  return sl+' ~ '+el;
}
function isAdj(s,e,cy,cm){return(s.getMonth()+1!==cm||s.getFullYear()!==cy)||(e.getMonth()+1!==cm||e.getFullYear()!==cy);}
function getTxRange(s,e){var ss=dStr(s),ee=dStr(e);return state.txns.filter(function(t){return t.date>=ss&&t.date<=ee;});}
function applyRec(){
  var key=mk(state.curY,state.curM);
  if(!state.appliedRec[key])state.appliedRec[key]=[];
  var applied={};state.appliedRec[key].forEach(function(id){applied[id]=true;});
  var changed=false;
  state.recurring.forEach(function(r){
    if(!applied[r.id]){
      var ld=new Date(state.curY,state.curM,0).getDate(),d=Math.min(r.day,ld);
      state.txns.push({id:state.nextId++,type:'expense',desc:r.desc,amount:r.amount,cat:r.cat,
        date:key+'-'+pad(d),expType:'fixed',affectsBalance:r.affectsBalance!==false,
        payType:'lump',instTotal:1,instCurrent:1,recurringId:r.id});
      state.appliedRec[key].push(r.id);changed=true;
    }
  });
  if(changed)saveState();
}

  charts.trend=new Chart(document.getElementById('trend'),{type:'bar',
    data:{labels:data.map(function(d){return d.label;}),datasets:[
      {label:'수입',data:data.map(function(d){return d.inc;}),backgroundColor:'rgba(6,194,112,.25)',borderColor:'#06C270',borderWidth:2,borderRadius:4},
      {label:'내 지출',data:data.map(function(d){return d.myExp;}),backgroundColor:'rgba(255,77,79,.25)',borderColor:'#FF4D4F',borderWidth:2,borderRadius:4},
      {label:'미차감',data:data.map(function(d){return d.nobal;}),backgroundColor:'rgba(100,116,139,.15)',borderColor:'#94A3B8',borderWidth:1.5,borderRadius:4},
      {label:'잔액',data:data.map(function(d){return d.bal;}),type:'line',borderColor:'#3B6EF0',backgroundColor:'rgba(59,110,240,.08)',fill:true,borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#3B6EF0',pointBorderColor:'#fff',pointBorderWidth:2,tension:.4,yAxisID:'y1'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' '+ctx.dataset.label+': '+fmt(ctx.raw);}}}},
      scales:{y:{ticks:{callback:function(v){return fS(v);},font:{size:10}},grid:{color:'rgba(148,163,184,0.1)'}},y1:{position:'right',ticks:{callback:function(v){return fS(v);},font:{size:10}},grid:{display:false}},x:{ticks:{font:{size:11,weight:'600'}},grid:{display:false}}}}
  });
}

function catItemHTML(c,ctype,sp,bg){
  var isEditing=editingCat&&editingCat.ctype===ctype&&editingCat.key===c.key;
  var chips=PC.map(function(col,i){
    return '<div class="colorchip'+(col===c.color?' on':'')+'" style="background:'+col+'" onclick="setEditColor(\''+col+'\')"></div>';
  }).join('');
  var base='<div class="cat-item'+(isEditing?' editing':'')+'" id="ci-'+ctype+'-'+c.key+'">'
    +'<div class="cat-top">'
      +'<div class="cat-icon" style="background:'+c.color+'18">'+c.emoji+'</div>'
      +'<div class="cat-info"><div class="cat-name">'+c.label+'</div>'
        +'<div class="cat-sub">'+fS(sp)+'원 사용'+(ctype==='exp'&&bg?' · 예산 '+fS(bg)+'원':'')+'</div>'
      +'</div>'
      +'<button class="cat-edit-btn" onclick="startEdit(\''+ctype+'\',\''+c.key+'\')">수정</button>'
    +'</div>';
  if(isEditing){
    var hb=bg>0,pct=hb?Math.min(Math.round(sp/bg*100),100):0,over=hb&&sp>bg,bc=over?'var(--red)':pct>80?'var(--amber)':c.color;
    base+=
      '<div class="edit-form">'
        +'<div class="row r2" style="margin-bottom:10px"><input id="e-label" type="text" value="'+c.label+'" placeholder="카테고리 이름"/><input id="e-emoji" type="text" value="'+c.emoji+'" placeholder="이모지" maxlength="2"/></div>'
        +(ctype==='exp'?'<div style="margin-bottom:10px"><input id="e-budget" type="number" value="'+bg+'" placeholder="월 예산 (원)"/></div>':'')
        +'<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px">색상</div>'
        +'<div class="colorpicker" id="e-colorpicker">'+chips+'</div>'
        +(ctype==='exp'&&hb?'<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+bc+'"></div></div><div class="budget-progress-row"><span style="color:var(--text2)">'+pct+'% 사용</span><span style="color:'+(over?'var(--red)':'var(--green)')+'">'+( over?'초과 '+fS(sp-bg)+'원':'잔여 '+fS(bg-sp)+'원')+'</span></div>':'')
        +'<div class="edit-btns" style="margin-top:12px"><button class="btn-blue" onclick="saveEdit(\''+ctype+'\',\''+c.key+'\')">저장</button><button class="btn-red" onclick="deleteCat(\''+ctype+'\',\''+c.key+'\')">삭제</button></div>'
        +'<button class="btn-cancel" onclick="cancelEdit()">취소</button>'
      +'</div>';
  }
  return base+'</div>';
}

function rCat(el){
  var mt=gMT(state.curY,state.curM),expSp={},incSp={};
  mt.filter(function(t){return t.type==='expense';}).forEach(function(t){expSp[t.cat]=(expSp[t.cat]||0)+t.amount;});
  mt.filter(function(t){return t.type==='income';}).forEach(function(t){incSp[t.cat]=(incSp[t.cat]||0)+t.amount;});
  var chips=PC.map(function(col,i){return '<div class="colorchip'+(i===selCI?' on':'')+'" style="background:'+col+'" onclick="selC('+i+')"></div>';}).join('');
  el.innerHTML=
    '<div class="hero" style="padding-bottom:20px"><div class="hero-nav" style="margin-bottom:0">'
      +'<span class="hero-month">카테고리</span>'
      +'<span style="font-size:12px;color:rgba(255,255,255,.5)">'+state.curY+'년 '+state.curM+'월</span>'
    +'</div></div>'
    +'<span class="group-label">지출 카테고리</span>'
    +'<div style="padding:0 16px">'+state.expCats.map(function(c){return catItemHTML(c,'exp',expSp[c.key]||0,state.catBudgets[c.key]||0);}).join('')+'</div>'
    +'<span class="group-label">수입 카테고리</span>'
    +'<div style="padding:0 16px">'+state.incCats.map(function(c){return catItemHTML(c,'inc',incSp[c.key]||0,0);}).join('')+'</div>'
    +'<div style="padding:0 16px">'
      +'<div class="form-card" style="margin-top:8px"><div class="card-title">새 카테고리 추가</div>'
        +'<div class="row r2" style="margin-bottom:10px"><input id="cl" placeholder="카테고리 이름"/><input id="ce" placeholder="이모지" maxlength="2"/></div>'
        +'<select id="catype" style="margin-bottom:10px"><option value="exp">지출 카테고리</option><option value="inc">수입 카테고리</option></select>'
        +'<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px">색상 선택</div>'
        +'<div class="colorpicker">'+chips+'</div>'
        +'<button class="addbtn" onclick="aCat()">+ 카테고리 추가</button>'
      +'</div>'
      +'<div class="form-card"><div class="card-title">데이터 백업 / 복원</div>'
        +'<p style="font-size:12px;color:var(--text2);margin-bottom:4px;line-height:1.6;font-weight:500">URL 변경이나 재설치 시 백업 파일로 데이터를 복원할 수 있어요.</p>'
        +'<div class="backup-btns"><button class="btn-export" onclick="exportData()">⬇ 백업 저장</button><button class="btn-import" onclick="importData()">⬆ 불러오기</button></div>'
      +'</div>'
    +'</div>';
}

function sTab(t){state.tab=t;editingCat=null;saveState();render();}
function pM(){state.curM--;if(state.curM<1){state.curM=12;state.curY--;}saveState();render();}
function nM(){state.curM++;if(state.curM>12){state.curM=1;state.curY++;}saveState();render();}
function sHT(t){state.histTab=t;saveState();render();}
function onTypeChange(){
  var isExp=document.getElementById('ft')&&document.getElementById('ft').value==='expense';
  var eo=document.getElementById('expense-options'),fi=document.getElementById('fc-inc');
  if(eo)eo.style.display=isExp?'':'none';
  if(fi)fi.style.display=isExp?'none':'';
}
function onPayChange(){
  var isInst=document.getElementById('fpay')&&document.getElementById('fpay').value==='installment';
  var iF=document.getElementById('inst-fields');if(iF)iF.style.display=isInst?'block':'none';
}
function addT(){
  var desc=document.getElementById('fd').value.trim();
  var amount=parseInt(document.getElementById('fa').value);
  var date=document.getElementById('fdt').value;
  var type=document.getElementById('ft').value;
  if(!amount||amount<=0||!date){alert('금액과 날짜를 입력해주세요.');return;}
  var cat,expType='personal',affectsBalance=true,payType='lump',instTotal=1,instCurrent=1;
  if(type==='income'){
    cat=document.getElementById('fc-inc').value;
    if(!desc){var ic=gIC(cat);desc=ic.label;}
  } else {
    cat=document.getElementById('fc-exp').value;
    if(!desc){var ec=gEC(cat);desc=ec.label;}
    expType=document.getElementById('fet').value;
    affectsBalance=document.getElementById('faff').checked;
    payType=document.getElementById('fpay').value;
    if(payType==='installment'){
      instTotal=parseInt(document.getElementById('ftotal').value)||1;
      instCurrent=parseInt(document.getElementById('fcur').value)||1;
      if(instTotal<2){alert('할부는 2회 이상이어야 합니다.');return;}
      if(instCurrent<1||instCurrent>instTotal){alert('회차를 올바르게 입력해주세요.');return;}
    }
  }
  state.txns.push({id:state.nextId++,type:type,desc:desc,amount:amount,cat:cat,date:date,expType:expType,affectsBalance:affectsBalance,payType:payType,instTotal:instTotal,instCurrent:instCurrent});
  var parts=date.split('-');state.curY=parseInt(parts[0]);state.curM=parseInt(parts[1]);
  saveState();render();
}
function dT(id){if(!confirm('이 내역을 삭제할까요?'))return;state.txns=state.txns.filter(function(tx){return tx.id!==id;});saveState();render();}
function sWB(){var v=parseInt(document.getElementById('wbi').value);if(v>0){state.weeklyBudget=v;saveState();render();}}
function aRec(){
  var desc=document.getElementById('rd').value.trim();
  var amount=parseInt(document.getElementById('ra').value);
  var day=parseInt(document.getElementById('rday').value);
  var cat=document.getElementById('rc').value;
  var affR=document.getElementById('raff').checked;
  if(!amount||!day||day<1||day>31){alert('금액과 날짜를 올바르게 입력해주세요.');return;}
  if(!desc){desc=gEC(cat).label;}
  var id=state.nextRId++;
  state.recurring.push({id:id,desc:desc,amount:amount,cat:cat,day:day,affectsBalance:affR});
  var key=mk(state.curY,state.curM);
  if(!state.appliedRec[key])state.appliedRec[key]=[];
  var applied={};state.appliedRec[key].forEach(function(i){applied[i]=true;});
  if(!applied[id]){
    var ld=new Date(state.curY,state.curM,0).getDate(),d=Math.min(day,ld);
    state.txns.push({id:state.nextId++,type:'expense',desc:desc,amount:amount,cat:cat,date:key+'-'+pad(d),expType:'fixed',affectsBalance:affR,payType:'lump',instTotal:1,instCurrent:1,recurringId:id});
    state.appliedRec[key].push(id);
  }
  saveState();render();
}
function dRec(id){if(!confirm('고정 지출을 삭제할까요?'))return;state.recurring=state.recurring.filter(function(r){return r.id!==id;});saveState();render();}
function startEdit(ct,key){editingCat={ctype:ct,key:key};renderContent();}
function cancelEdit(){editingCat=null;renderContent();}
function setEditColor(col){
  document.querySelectorAll('#e-colorpicker .colorchip').forEach(function(chip){
    chip.classList.toggle('on',chip.style.backgroundColor===col||chip.style.background===col);
  });
  if(editingCat)editingCat.newColor=col;
}
function saveEdit(ct,key){
  var label=document.getElementById('e-label').value.trim();
  var emoji=document.getElementById('e-emoji').value.trim()||'📌';
  if(!label){alert('카테고리 이름을 입력해주세요.');return;}
  var arr=ct==='exp'?state.expCats:state.incCats;
  var cat=arr.find(function(c){return c.key===key;});
  if(!cat)return;
  cat.label=label;cat.emoji=emoji;
  if(editingCat&&editingCat.newColor)cat.color=editingCat.newColor;
  if(ct==='exp'){var be=document.getElementById('e-budget');if(be)state.catBudgets[key]=parseInt(be.value)||0;}
  editingCat=null;saveState();renderContent();
}
function deleteCat(ct,key){
  var arr=ct==='exp'?state.expCats:state.incCats;
  var cat=arr.find(function(c){return c.key===key;});
  if(state.txns.some(function(t){return t.cat===key;})){alert("'"+cat.label+"' 카테고리는 내역이 있어 삭제할 수 없어요.");return;}
  if(!confirm("'"+cat.label+"' 카테고리를 삭제할까요?"))return;
  if(ct==='exp'){state.expCats=state.expCats.filter(function(c){return c.key!==key;});delete state.catBudgets[key];}
  else state.incCats=state.incCats.filter(function(c){return c.key!==key;});
  editingCat=null;saveState();renderContent();
}
function selC(i){selCI=i;document.querySelectorAll('.colorpicker .colorchip').forEach(function(el,idx){el.classList.toggle('on',idx===i);});}
function aCat(){
  var label=document.getElementById('cl').value.trim();
  var emoji=document.getElementById('ce').value.trim()||'📌';
  var ct=document.getElementById('catype').value;
  var color=PC[selCI]||PC[0];
  if(!label){alert('카테고리 이름을 입력해주세요.');return;}
  var key=(ct==='inc'?'inc-':'')+'cat'+state.nextCK++;
  if(ct==='exp'){state.expCats.push({key:key,label:label,emoji:emoji,color:color});state.catBudgets[key]=0;}
  else state.incCats.push({key:key,label:label,emoji:emoji,color:color});
  selCI=0;saveState();renderContent();
}
function exportData(){
  var json=JSON.stringify(state,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var today=new Date(),ds=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  a.href=url;a.download='가계부_백업_'+ds+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importData(){
  var input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var parsed=JSON.parse(ev.target.result);
        if(!parsed.txns){alert('올바른 백업 파일이 아닙니다.');return;}
        if(!confirm('현재 데이터를 백업 파일로 덮어쓸까요?'))return;
        state=migrate(parsed);saveState();editingCat=null;render();alert('복원 완료!');
      }catch(e){alert('파일을 읽을 수 없어요.');}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);input.click();document.body.removeChild(input);
}
render();
</script>
</body>
</html>
